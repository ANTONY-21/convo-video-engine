<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;
background:radial-gradient(ellipse at 50% 42%, #2a0a10 0%, #120508 55%, #080305 100%)}
#root{width:100%;height:100%;position:relative}
/* EYE: sclera + iris rings */
#eye{position:absolute;left:540px;top:820px;width:640px;height:640px;
margin:-320px 0 0 -320px;border-radius:50%;
background:radial-gradient(circle at 50% 45%, #fff 0%, #f3e7e2 55%, #d9c3bc 80%);
box-shadow:0 0 120px 30px rgba(255,60,80,.25), inset 0 -30px 80px rgba(120,30,40,.3)}
#iris{position:absolute;left:540px;top:820px;width:300px;height:300px;
margin:-150px 0 0 -150px;border-radius:50%;
background:radial-gradient(circle at 45% 40%, #7fd4e8 0%, #2a7a9b 40%, #12374a 75%, #06131c 100%);
box-shadow:inset 0 0 40px rgba(0,0,0,.7), 0 0 60px rgba(60,180,220,.3)}
#pupil{position:absolute;left:540px;top:820px;width:120px;height:120px;
margin:-60px 0 0 -60px;border-radius:50%;background:#050505;
box-shadow:inset 0 0 18px #000}
/* cracks appearing = cornea tear */
.crack{position:absolute;left:540px;top:820px;width:6px;height:220px;
margin:-110px 0 0 -3px;border-radius:3px;
background:linear-gradient(to bottom, transparent, #ff4455 20%, #ff8896 50%, #ff4455 80%, transparent);
opacity:0;filter:drop-shadow(0 0 8px #ff4455)}
/* debris particles */
.dp{position:absolute;width:10px;height:10px;border-radius:50%;
background:#ff8896;box-shadow:0 0 10px 3px rgba(255,68,85,.5);opacity:0}
/* warning ring */
#wring{position:absolute;left:540px;top:820px;width:760px;height:760px;
margin:-380px 0 0 -380px;border-radius:50%;
border:5px solid rgba(255,68,85,.55);opacity:0}
#tag{position:absolute;bottom:40px;right:60px;font:600 28px monospace;
color:#ff4455;opacity:.55}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5"
     data-width="1080" data-height="1920">
<div id="eye" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div id="iris" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div id="pupil" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div class="crack clip" data-start="0" data-duration="5" data-track-index="0" data-c="0"></div>
<div class="crack clip" data-start="0" data-duration="5" data-track-index="0" data-c="1"></div>
<div class="crack clip" data-start="0" data-duration="5" data-track-index="0" data-c="2"></div>
<div class="crack clip" data-start="0" data-duration="5" data-track-index="0" data-c="3"></div>
<div class="dp" data-d="0"></div><div class="dp" data-d="1"></div>
<div class="dp" data-d="2"></div><div class="dp" data-d="3"></div>
<div class="dp" data-d="4"></div><div class="dp" data-d="5"></div>
<div id="wring"></div>
<div id="tag">B-ROLL</div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
// eye enters with pressure pulse (rubbing force)
tl.fromTo("#eye", { scale: .92 }, { scale: 1.06, duration: .9,
  repeat: 5, yoyo: true, ease: "sine.inOut" }, 0);
tl.fromTo("#iris", { scale: 1, rotation: 0 }, { scale: 1.12, rotation: 8,
  duration: .9, repeat: 5, yoyo: true, ease: "sine.inOut" }, 0);
// iris color distress: use opacity flicker on a red tint overlay
tl.fromTo("#pupil", { scale: 1 }, { scale: 1.3, duration: 2.4,
  ease: "power2.in" }, 0);
// cracks shoot out at 1.8s
for (let i = 0; i < 4; i++) {
  const a = (i / 4) * 360 + 22;
  tl.set(`[data-c="${i}"]`, { rotation: a }, 0);
  tl.fromTo(`[data-c="${i}"]`, { opacity: 0, scaleY: .1 },
    { opacity: 1, scaleY: 1, duration: .35, ease: "power4.out" }, 1.8 + i * .18);
}
// debris burst
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2, r = 260 + (i % 3) * 70;
  tl.fromTo(`[data-d="${i}"]`,
    { x: 540, y: 820, opacity: 1 },
    { x: 540 + r * Math.cos(a), y: 820 + r * Math.sin(a), opacity: 0,
      duration: 1.2, ease: "power2.out" }, 2.4);
}
// warning ring pulse
tl.fromTo("#wring", { opacity: 0, scale: .8 },
  { opacity: 1, scale: 1.05, duration: .4 }, 2.2);
tl.to("#wring", { opacity: 0, scale: 1.25, duration: .6 }, 3.4);
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
