<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;
background:radial-gradient(ellipse at 50% 45%, #17130a 0%, #0d0a04 55%, #050402 100%)}
#root{width:100%;height:100%;position:relative}
#bookmark{position:absolute;left:540px;top:820px;width:180px;height:240px;
margin:-120px 0 0 -90px;
background:linear-gradient(160deg, #ffd24a 0%, #ff9f1c 100%);
clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
box-shadow:0 0 80px 18px rgba(255,190,50,.45);opacity:0}
#bell{position:absolute;left:540px;top:1150px;width:150px;height:150px;
margin:-75px 0 0 -75px;border-radius:50% 50% 8px 8px;
background:linear-gradient(160deg, #ffe08a 0%, #ffb84a 100%);
box-shadow:0 0 50px 12px rgba(255,200,80,.4);opacity:0}
.beam{position:absolute;left:540px;top:870px;width:14px;height:520px;
margin:-210px 0 0 -4px;border-radius:4px;
background:linear-gradient(to bottom, transparent, rgba(255,210,74,.85), transparent);
opacity:0}
#tag{position:absolute;bottom:40px;right:60px;font:600 28px monospace;
color:#ffd24a;opacity:.55}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5"
     data-width="1080" data-height="1920">
<div class="beam" data-m="0"></div><div class="beam" data-m="1"></div>
<div class="beam" data-m="2"></div><div class="beam" data-m="3"></div>
<div class="beam" data-m="4"></div><div class="beam" data-m="5"></div>
<div id="bookmark" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div id="bell" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
<div id="tag">B-ROLL</div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
// bookmark drops in with bounce
tl.fromTo("#bookmark", { y: -420, opacity: 0, scale: .8 },
  { y: 0, opacity: 1, scale: 1, duration: .7, ease: "bounce.out" }, .2);
// bell pops after
tl.fromTo("#bell", { scale: 0, opacity: 0 },
  { scale: 1, opacity: 1, duration: .5, ease: "back.out(2)" }, 1.0);
// bell swing (ring!)
tl.to("#bell", { rotation: 12, duration: .12, yoyo: true, repeat: 9,
  ease: "sine.inOut" }, 1.6);
// radiating beams
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * 360 + 15;
  tl.set(`[data-m="${i}"]`, { rotation: a }, 0);
  tl.fromTo(`[data-m="${i}"]`, { opacity: 0, scaleY: .4 },
    { opacity: .8, scaleY: 1.1, duration: .8, ease: "power1.out" }, 2.0 + (i % 3) * .25);
  tl.to(`[data-m="${i}"]`, { opacity: 0, scaleY: 1.3, duration: .5 }, 2.9);
}
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
