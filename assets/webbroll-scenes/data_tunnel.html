<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#141005}
#root{width:100%;height:100%;position:relative}
.dt{position:absolute;width:16px;height:16px;border-radius:50%;background:#FFD24A;box-shadow:0 0 18px 6px rgba(255,210,74,.45)}
#tag{position:absolute;bottom:40px;right:60px;font:600 28px monospace;color:#FFD24A;opacity:.55}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5"
     data-width="1080" data-height="1920">
<div class="dt clip" data-t="0"></div><div class="dt clip" data-t="1"></div>
<div class="dt clip" data-t="2"></div><div class="dt clip" data-t="3"></div>
<div class="dt clip" data-t="4"></div><div class="dt clip" data-t="5"></div>
<div class="dt clip" data-t="6"></div><div class="dt clip" data-t="7"></div>
<div class="dt clip" data-t="8"></div><div class="dt clip" data-t="9"></div>
<div class="dt clip" data-t="10"></div><div class="dt clip" data-t="11"></div>
<div id="tag">B-ROLL</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
// Deterministic pseudo-random field (seeded)
function prand(i){ const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); }
for (let i = 0; i < 24; i++) {
  const el = `[data-t="${i}"]`;
  const px = (prand(i) - 0.5) * 1600, py = (prand(i + 40) - 0.5) * 1600;
  const phase = prand(i + 80) * 5;
  gsap.set(el, { x: 540 + px, y: 860 + py, opacity: 0.3 });
  tl.fromTo(el, { scale: 0.4, opacity: 0.15 },
    { scale: 5 + prand(i) * 4, opacity: 0.95, duration: 5, ease: "power1.in",
      repeat: 0 }, Math.min(phase, 4.5));
}
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
